name: "Lab journal De Alleluia"
author: 
  - 'Celis Tittse'
output_dir: "docs"
exclude: 
  - "data"
  - "_test"
bibliography: references.bib
navbar:
  left:
    - icon: fa-home
      href: index.html
    - text: "My journal"
      menu:
      - text: "Introduction"
        href: intro.html
      - text: "Literature Review"
        href: literature_review_hypotheses.html
      - text: "Model Definition"
        href: "model_statistics.Rmd"
      - text: "Data"
        href: data_wrangling.html
      - text: "Exploratory EDA"
        href: eda.html
      - text: "Model High Middle Ages Collections"
        href: rsiena_model.html
      - text: "Model results"
        href: alleluia.txt
      - text: "Model Effects"
        href: myeff.html

  right:
  - icon: fab fa-github
    href: https://github.com/JochemTolsma/labjournal
output:
  html_document:
    theme: flatly
    highlight: default
    toc:  true
    toc_float: true
    number_sections: true
    code_folding: show
    code_download: yes
    css: tweaks.css
